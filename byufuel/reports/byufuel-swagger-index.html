<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css">
    <link rel="stylesheet" type="text/css" href="index.css" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    <style type="text/css">.servers-title,.servers{display:none} .swagger-ui .info{margin:10px 0} .swagger-ui .scheme-container{margin:10px 0;padding:10px 0} .swagger-ui .info .title{font-size:25px} .swagger-ui textarea{min-height:150px}</style>

    <script>
const SearchPlugin = (system) => ({
  fn: {
    opsFilter: (taggedOps, phrase) => {
      const words = phrase.toLowerCase().split(/\s+/);
      const allOps = JSON.parse(JSON.stringify(taggedOps));
      for (const tagObj in allOps) {
        let ops = allOps[tagObj].operations;
        ops = ops.filter(op => {
          const toLowerSafe = (value) => (value ? value.toLowerCase() : '');
          const searchProps = [
            toLowerSafe(op.path),
            toLowerSafe(op.operation.summary),
            toLowerSafe(op.operation.description),
            toLowerSafe(JSON.stringify(op.operation.parameters)),
            toLowerSafe(JSON.stringify(op.operation.responses)),
            toLowerSafe(JSON.stringify(op.operation.requestBody))
          ];
          return words.every(word => searchProps.some(prop => prop.includes(word)));
        });
        if (ops.length) {
          allOps[tagObj].operations = ops;
        } else {
          delete allOps[tagObj];
        }
      }
      return system.Im.fromJS(allOps);
    }
  }
});

const initPlugin = () => {
  const ui = window.ui || window.swaggerUi;
  if (ui && ui.getSystem) {
    ui.getSystem().fn.opsFilter = SearchPlugin(ui.getSystem()).fn.opsFilter;
    const searchBox = document.querySelector('.filter-container input');
    if (searchBox) {
      searchBox.placeholder = "Search...";
      searchBox.addEventListener('input', (event) => {
        const phrase = event.target.value;
        const system = ui.getSystem();
        const taggedOps = system.getState().toJS().taggedOps;
        const filteredOps = system.fn.opsFilter(taggedOps, phrase);
        system.getState().update('taggedOps', () => filteredOps);
      });
    }
  } else {
    setTimeout(initPlugin, 250);
  }
};
document.addEventListener('DOMContentLoaded', initPlugin);
</script>
</head>

  <body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui-bundle.js" charset="UTF-8"> </script>
    <script src="./swagger-ui-standalone-preset.js" charset="UTF-8"> </script>
    <script>
window.onload = function() {
  var url = window.location.search.match(/url=([^&]+)/);
  if (url && url.length > 1) {
    url = decodeURIComponent(url[1]);
  } else {
    url = undefined;
  }
  var urls = [{"url":"/swagger/Frontend.Api-V1/swagger.json","name":"Frontend.Api-V1"},{"url":"/swagger/CentvisApps-V1/swagger.json","name":"CentvisApps-V1"},{"url":"/swagger/CentvisByufuel-V1/swagger.json","name":"CentvisByufuel-V1"},{"url":"/swagger/CentvisMdm-V1/swagger.json","name":"CentvisMdm-V1"},{"url":"/swagger/CentvisChat-V1/swagger.json","name":"CentvisChat-V1"}];

  const disableTryItOutPlugin = function() {
    return {
      statePlugins: {
      spec: {
        wrapSelectors: {
          allowTryItOutFor: function() {
            return function() {
                return true;
              }
            }
          }
        }
      }
    }
  }

  // Build a system
  var ui = SwaggerUIBundle({
    url: url,
    urls: urls,  
    validatorUrl: null,
    oauth2RedirectUrl: window.location.origin + "/swagger/oauth2-redirect.html",

    docExpansion: "none", 
    operationsSorter: "alpha", 
    defaultModelsExpandDepth: 1, 
    defaultModelExpandDepth: 1, 
    tagsSorter: "alpha", 
    filter: true, 
    persistAuthorization: false, 
    displayRequestDuration: true, 
    tryItOutEnabled: true, 
    
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [
      SwaggerUIBundle.presets.apis,
      SwaggerUIStandalonePreset
    ],
    plugins: [
        SwaggerUIBundle.plugins.DownloadUrl,
        disableTryItOutPlugin
    ],
    layout: "StandaloneLayout"
  });

  if ("byufuel-api-swaggerui") {
    var clientSecret = "client_secret";
    ui.initOAuth({
      clientId: "byufuel-api-swaggerui",
      clientSecret: clientSecret ? clientSecret : undefined,
      realm: "realm",
      appName: "Frontend.Api",
      scopeSeparator: " ",
      scopes: ["openid","profile","email","roles","offline_access","byufuel-api"],
      additionalQueryStringParams: {},
      usePkceWithAuthorizationCodeGrant: false
    });
  }

  window.ui = ui;
}
    </script>
    
  </body>
</html>
